name: Deploy to VPS with Git Commit Tag

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get short commit SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: 🚀 Pull latest code & build/run Docker on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/zoan-llm-backend

            echo "Fetching latest changes..."
            git fetch origin dev
            git checkout dev
            git reset --hard origin/dev

            COMMIT_ID=$(git rev-parse --short HEAD)
            echo "Building Docker image with tag: zoan-llm-backend:${COMMIT_ID}"
            docker build --no-cache -t zoan-llm-backend:${COMMIT_ID} .

            echo "Stopping previous container..."
            docker stop zoan-llm-backend || true
            docker rm zoan-llm-backend || true

            echo "Running new container..."
            IMAGE_TAG=${COMMIT_ID} docker compose up -d --build
