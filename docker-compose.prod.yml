# Docker Compose for production
version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_CONN_STRING=${POSTGRES_CONN_STRING}
      - FERNET_SECRET=${FERNET_SECRET}
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    networks:
      - zoan-network

networks:
  zoan-network:
    external: true
