# Docker Compose for production
version: "3.8"

services:
  app:
    container_name: zoan-llm-backend
    image: zoan-llm-backend:${IMAGE_TAG}
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_CONN_STRING=${POSTGRES_CONN_STRING}
      - FERNET_SECRET=${FERNET_SECRET}
    volumes:
      - .:/app
      - ./games:/app/games
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    networks:
      - zoan-network

networks:
  zoan-network:
    external: true
