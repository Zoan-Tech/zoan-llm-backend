# Docker Compose for development
version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_CONN_STRING=${POSTGRES_CONN_STRING}
      - FERNET_SECRET=${FERNET_SECRET}
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
