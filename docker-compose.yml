# Docker Compose for development
version: "3.8"

services:
  app:
    container_name: zoan-llm-backend
    image: zoan-llm-backend:${IMAGE_TAG}
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_CONN_STRING=${POSTGRES_CONN_STRING}
      - FERNET_SECRET=${FERNET_SECRET}
    volumes:
      - .:/app
      - ./games:/app/games
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - zoan-network

networks:
  zoan-network:
    external: true
