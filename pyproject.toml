[project]
name = "zoan-llm-backend"
version = "0.1.0"
description = "Zoan LLM Backend Service"
requires-python = ">=3.11,<3.14"
dependencies = [
    "confluent-kafka>=2.12.2",
    "docling>=2.61.2",
    "dotenv>=0.9.9",
    "fastapi>=0.121.1",
    "langchain>=1.0.5",
    "langchain-anthropic>=1.0.2",
    "langchain-openai>=1.0.2",
    "langfuse>=3.9.1",
    "langgraph>=1.0.3",
    "langgraph-checkpoint-postgres>=3.0.1",
    "langgraph-supervisor>=0.0.30",
    "minio>=7.2.18",
    "psycopg-binary>=3.2.12",
    "qdrant-client>=1.15.1",
    "sentence-transformers>=5.1.2",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["action", "config", "handler", "internal", "model", "services", "utils"]
