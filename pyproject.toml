[project]
name = "zoan-llm-backend"
version = "0.1.0"
description = "Zoan LLM Backend Service"
requires-python = ">=3.11,<3.14"
dependencies = [
    "confluent-kafka==2.12.2",
    "docling==2.64.1",
    "dotenv==0.9.9",
    "fastapi==0.124.4",
    "grpcio==1.76.0",
    "grpcio-tools==1.76.0",
    "langchain==1.1.3",
    "langchain-anthropic==1.3.0",
    "langchain-core==1.2.0",
    "langchain-google-genai==4.0.0",
    "langchain-google-vertexai==3.2.0",
    "langchain-openai==1.1.3",
    "langfuse==3.10.6",
    "langgraph==1.0.5",
    "langgraph-checkpoint-postgres==3.0.2",
    "langgraph-supervisor==0.0.31",
    "langgraph-swarm==0.1.0",
    "minio==7.2.20",
    "psycopg-binary==3.3.2",
    "qdrant-client==1.16.2",
    "sentence-transformers==5.2.0",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["action", "config", "handler", "internal", "model", "services", "utils"]
